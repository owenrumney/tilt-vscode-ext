name: Tiltfile builtins

# The builtin table is generated from the stub tree `tilt dump api-docs`
# writes, vendored at lsp/internal/builtins/gen/api. A new Tilt release can
# change that API, and nothing in the repository would notice.
#
# This opens a pull request with the regenerated table rather than failing:
# the diff is the work, and a recurring red build teaches you to ignore it.

on:
  schedule:
    # Mondays, 07:00 UTC. Tilt releases every four to eight weeks, so this
    # mostly exits at the version gate below.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No persisted credentials: this job runs a downloaded tilt binary, and
      # create-pull-request is given its own token below.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Cheap gate: one API call and a grep, so no Tilt is downloaded on the
      # many weeks when nothing has changed.
      - name: Compare the vendored version to the latest release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/tilt-dev/tilt/releases/latest --jq .tag_name)
          vendored=$(sed -n 's/^const TiltVersion = "\(.*\)"$/\1/p' \
            lsp/internal/builtins/builtins_gen.go)
          echo "latest=$latest"     >> "$GITHUB_OUTPUT"
          echo "vendored=$vendored" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$vendored" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Up to date on $vendored."
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::vendored $vendored, latest $latest"
          fi

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.version.outputs.stale == 'true'
        with:
          go-version-file: lsp/go.mod
          cache-dependency-path: lsp/go.sum

      # The detected tag, not "latest", so the dump and the stamp agree.
      - name: Install the released Tilt
        if: steps.version.outputs.stale == 'true'
        env:
          TAG: ${{ steps.version.outputs.latest }}
        run: |
          version="${TAG#v}"
          asset="tilt.${version}.linux.x86_64.tar.gz"
          base="https://github.com/tilt-dev/tilt/releases/download/${TAG}"
          mkdir -p /tmp/tiltdl /tmp/tiltbin
          cd /tmp/tiltdl
          curl -fsSL -O "${base}/${asset}"
          curl -fsSL -O "${base}/checksums.txt"
          # This job holds a write token, so the archive is verified before
          # anything in it is executed.
          grep " ${asset}\$" checksums.txt > expected.txt
          sha256sum -c expected.txt
          tar -xzf "${asset}" -C /tmp/tiltbin tilt
          echo /tmp/tiltbin >> "$GITHUB_PATH"

      - name: Re-dump and regenerate
        if: steps.version.outputs.stale == 'true'
        run: |
          tilt version
          make lsp-dump
          make lsp-gen

      # A new builtin can break the parser or the grammar, so the tests gate
      # the pull request rather than running after a merge.
      - name: Test
        if: steps.version.outputs.stale == 'true'
        run: make lsp-test

      - name: Open a pull request
        if: steps.version.outputs.stale == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          # GitHub starts no workflow for a pull request opened by GITHUB_TOKEN,
          # so ci.yml only runs on this PR when BUILTINS_PR_TOKEN is set.
          token: ${{ secrets.BUILTINS_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: chore/tilt-builtins
          base: main
          commit-message: |
            chore(lsp): update Tiltfile builtins to Tilt ${{ steps.version.outputs.latest }}
          title: "chore(lsp): update Tiltfile builtins to Tilt ${{ steps.version.outputs.latest }}"
          body: |
            `tilt dump api-docs` from Tilt ${{ steps.version.outputs.latest }},
            replacing the stubs vendored from ${{ steps.version.outputs.vendored }}.

            Regenerated by `make lsp-dump && make lsp-gen`:

            - `lsp/internal/builtins/gen/api/` — the stub tree
            - `lsp/internal/builtins/builtins_gen.go` — the table
            - `resources/tiltfile.tmLanguage.json` — the grammar's builtin lists

            `make lsp-test` passed, which includes the closure tests over the
            stub tree and the grammar drift guard.

            Review for:

            - A **new builtin** that declares a resource. `internal/model` has a
              hand-written list of those, which no generator updates.
            - A **removed builtin** still referenced by
              `internal/builtins/supplement.go`. The supplement only fills
              holes; an entry Tilt now declares should be deleted.
            - A docstring that converts badly to markdown.
          labels: dependencies
          delete-branch: true
